[package]
name = "codescribe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Vetcoders <hello@vetcoders.io>"]
license = "FSL-1.1-ALv2"
description = "Core library for Codescribe (audio, STT, quality pipeline)"
repository = "https://github.com/vetcoders/codescribe"
homepage = "https://vetcoders.github.io/codescribe/"
documentation = "https://vetcoders.github.io/codescribe/quickstart/"
keywords = ["speech-to-text", "whisper", "audio", "transcription", "stt"]
categories = ["multimedia::audio", "multimedia::encoding"]

[lib]
path = "lib.rs"

[[bin]]
name = "codescribe-stt-sidecar"
path = "bin/codescribe-stt-sidecar.rs"

[[bin]]
name = "codescribe-whisper-validate"
path = "bin/codescribe-whisper-validate.rs"

[features]
default = []
licensing-dev = []
test-isolation = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }

# Logging & errors
tracing = "0.1"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "multipart", "blocking", "stream", "form", "query"] }

# Local STT (Whisper + Candle)
candle-core = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
candle-nn = "0.11"
tokenizers = "0.23"
indicatif = "0.18"
zip = "8.6"
# ndarray 0.17 required by ndarray-npy 0.10
ndarray = "0.17"
# Disable default features to avoid zip dep (we only need .npy, not .npz archives)
ndarray-npy = { version = "0.10", default-features = false }

# WebSocket client for voice chat
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "3"
tiny_http = "0.12"

# Audio
cpal = "0.18"
hound = "3.5"
symphonia = { version = "0.6", features = ["all", "mp3", "pcm", "isomp4", "alac"] }

# Text/embeddings
regex = "1"
unicode-segmentation = "1"

# Config/paths
directories = "6"
shellexpand = "3"
dotenvy = "0.15"

# Voice Activity Detection - custom Silero wrapper
# Model: silero_vad.onnx from https://github.com/snakers4/silero-vad
# NOTE: ort-download-binaries ensures runtime is available without manual install
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "coreml", "ndarray"] }

# Moshi - conversational voice AI (Kyutai Labs)
moshi = { git = "https://github.com/vetcoders/moshi", rev = "09dd71dfe8e5a2bbf5620d38231218d0ac22320c", features = ["metal"] }

# Time/utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
flate2 = "1.0"
lazy_static = "1.4"
deunicode = "1.6"
cap-std = "4"
security-framework = "3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# MCP stdio client: F_SETNOSIGPIPE on the child's stdin so a dead server's
# pipe yields EPIPE instead of a process-fatal SIGPIPE in the Swift host.
libc = "0.2"

[dev-dependencies]
codescribe_core = { package = "codescribe-core", path = ".", features = ["test-isolation"] }
mockito = "1"
serial_test = "3"

[build-dependencies]
anyhow = "1"
dirs = "7"
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokenizers = "0.23"

[lints.rust]
# Allow unexpected_cfgs from objc crate's msg_send! macro (uses cargo-clippy cfg internally)
# embed_model is set by build.rs when Whisper model is available
# embed_tts is set by build.rs when TTS model is available (CODESCRIBE_EMBED_TTS=1)
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(embed_model)', 'cfg(embed_tts)', 'cfg(embed_e5)'] }
