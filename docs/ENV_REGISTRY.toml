[vars.WHISPER_LANGUAGE]
default = "auto"
type = "string"
reload = "hot"
category = "stt"
description = "Whisper transcription language hint. auto leaves detection to Whisper and applies on the next capture."

[vars.CODESCRIBE_WHISPER_INITIAL_PROMPT]
default = ""
type = "string"
reload = "restart"
category = "stt"
description = "Initial prompt hint for Whisper decoding (ignored by ONNX adapter)"

[vars.CODESCRIBE_STT_INITIAL_PROMPT_ENABLED]
default = "0"
type = "bool"
reload = "hot"
category = "stt"
description = "Opt-in gate for Candle Whisper runtime-lexicon initial_prompt. Default OFF after W2-F measured a 100% WER regression with the active prompt."

[vars.CODESCRIBE_OVERLAY_HIGHLIGHTS]
default = "0"
type = "bool"
reload = "hot"
category = "stt"
description = "W13-6B span-based overlay highlight layer (lexicon-corrected words + Silero speech-gap pustki) and one-click send-span-to-Teach. Default OFF. No new permission prompts; consumes ReplaceRange/on_final/VAD data already crossing the bridge after W13-3A."

[vars.CODESCRIBE_SILERO_FUSION]
default = "0"
type = "bool"
reload = "restart"
category = "stt"
description = "W13-3B Silero-identity seal authority. Default OFF pending the operator live A/B required by the original THE_ENGINE_ROADMAP. Armed: Supervisor edges mint utterance ids at Apple PCM ingress, cumulative Apple finals are sliced by time onto those ranges, sealed spans carry silero_utterance_id, and Whisper/Apple fuse by span overlap (agreements + clear gap fills; unresolved alternatives are receipted). The session Silero still runs whenever hands-free silence arms the engine lifecycle."

[vars.CODESCRIBE_SILERO_FUSION_CONTEXT]
default = "utterance"
type = "string"
reload = "restart"
category = "stt"
description = "Bounded-context A/B for W13-3B Whisper windows: utterance (default), left_pad, or stable_prompt. Left pad never crosses a Silero-sized silence fence."

[vars.CODESCRIBE_SPAN_IDEMPOTENCE]
default = "1"
type = "bool"
reload = "restart"
category = "stt"
description = "Sealed-span replay refusal + in-span loop fence. Default ON: the live seal path refuses a replayed PCM-range / request identity and fences non-progressing timestamps or decode failure. Content-similar offers on a new identity are WARN-preserved. Set 0/false/off only as a diagnostic escape hatch."

[vars.CODESCRIBE_WHISPER_IDLE_UNLOAD_SECS]
default = "1800"
type = "u64"
reload = "hot"
category = "stt"
description = "Unload idle Whisper weights after this many seconds (default 1800 = 30 min). Idle is measured from the last finished decode, not from acquire and not from whether the app UI looks quiet. The full fp16 payload avoids q8 dequantization on the next cold load. Metal Device is process-cached and retained; the Metal free-buffer pool is force-pruned on unload so RSS actually drops. 0 is the explicit keep-warm override (weights stay resident). INFO-only residency events expose the effective TTL plus load/unload/reclaim counts and durations without audio or transcript content."

[vars.CANDLE_METAL_COMPUTE_PER_BUFFER]
default = "50"
type = "u64"
reload = "restart"
category = "stt"
description = "Candle-owned tuning knob (read by candle-metal-kernels at device creation): compute encoders per Metal command buffer before rotation. Codescribe mirror-reads it to bound the forced free-pool prune after idle unload (memory::reclaim_metal_buffer_pool)."

[vars.CANDLE_METAL_COMMAND_POOL_SIZE]
default = "5"
type = "u64"
reload = "restart"
category = "stt"
description = "Candle-owned tuning knob (read by candle-metal-kernels at device creation): Metal command-buffer pool size. Codescribe mirror-reads it to bound the forced free-pool prune after idle unload (memory::reclaim_metal_buffer_pool)."

[vars.WHISPER_INITIAL_PROMPT]
default = ""
type = "string"
reload = "restart"
category = "stt"
description = "Legacy alias for CODESCRIBE_WHISPER_INITIAL_PROMPT"
deprecated = "CODESCRIBE_WHISPER_INITIAL_PROMPT"

[vars.CODESCRIBE_MODEL_PATH]
default = ""
