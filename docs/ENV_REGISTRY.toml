# ENV_REGISTRY.toml - Central registry of all environment variables
#
# SINGLE SOURCE OF TRUTH for Codescribe environment configuration.
# This file is validated by pre-commit hooks - any new env var MUST be added here.
#
# Schema per variable:
#   [vars.<NAME>]
#   default = "value"           # Default value (string)
#   type = "string|bool|f32|u64"  # Value type
#   reload = "hot|restart|rebuild"  # When changes take effect
#   category = "vad|audio|llm|..." # Grouping
#   description = "..."         # Human-readable description
#   deprecated = "NEW_VAR"      # If deprecated, points to replacement
#
# Created by Vetcoders (c)2026

[meta]
version = "1.2.0"
updated = "2026-08-22"

# ═══════════════════════════════════════════════════════════════════════════════
# Application async runtime
# ═══════════════════════════════════════════════════════════════════════════════

[vars.CODESCRIBE_APP_RUNTIME_WORKERS]
default = "4"
type = "u64"
reload = "restart"
category = "runtime"
description = "Named Tokio async workers owned by Codescribe.app (clamped to 1-16; invalid values fall back to 4)"
range = "1-16"

# ═══════════════════════════════════════════════════════════════════════════════
# VAD (Voice Activity Detection) - Silero Neural Network
# ═══════════════════════════════════════════════════════════════════════════════
# VAD internals are hardcoded in `core/vad/config.rs` based on Silero defaults.
# No user-configurable VAD env vars.
#
# Dead folklore (never read; leftover .env lines, not product knobs):
#   CODESCRIBE_VAD_SILENCE_SEC, CODESCRIBE_VAD_PRE_ROLL_MS, CODESCRIBE_VAD_SILENCE_DB
# Product silence on the live Apple lane is TOGGLE_SILENCE_SEC → EpochGate
# (speech opens an SFSpeech epoch, silence past the slider closes it).

# ═══════════════════════════════════════════════════════════════════════════════
# Audio / Recording
# ═══════════════════════════════════════════════════════════════════════════════

[vars.AUDIO_INPUT_DEVICE]
default = ""
type = "string"
reload = "restart"
category = "audio"
description = "Audio input device name (empty = system default)"

[vars.CODESCRIBE_AUDIO_SPILL]
default = "1"
type = "bool"
reload = "restart"
category = "audio"
description = "Disk spill of the full streaming take (default on); the RAM ring stays capped at 300s, spill keeps every sample so long sessions archive whole. 0/false/no/off disables"

[vars.AUTO_SILENCE]
default = "1"
type = "bool"
reload = "restart"
category = "audio"
description = "Enable silence auto-stop in recorder"

[vars.BEEP_ON_START]
default = "1"
type = "bool"
reload = "restart"
category = "audio"
description = "Play beep when recording starts"

[vars.SOUND_NAME]
default = "Tink"
type = "string"
reload = "restart"
category = "audio"
description = "macOS system sound name for beep"

[vars.SOUND_VOLUME]
default = "1.0"
type = "f32"
reload = "restart"
category = "audio"
description = "Sound volume (0.0-1.0)"
range = "0.0-1.0"

[vars.CODESCRIBE_CAPTURE_LEVEL_LOW_DB]
default = "-52"
type = "f32"
reload = "hot"
category = "audio"
description = "W13-5 capture-level WARN floor in dBFS, keyed on active-speech median RMS (not all-audio). Corpus: golden era ≈ −38, break ≈ −44; −52 leaves headroom. Must stay a non-terminal quality receipt."

