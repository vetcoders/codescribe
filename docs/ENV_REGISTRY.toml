description = "Internal per-process sidecar authentication token injected only into the supervised child. Never configure or persist this value."

[vars.CODESCRIBE_TAIL_PATCH_MAX_CHANGE_RATIO]
default = "0.5"
type = "f32"
reload = "hot"
category = "stt"
description = "Layer 1 safety threshold: a tail-patch whose changed-character ratio against the committed utterance exceeds this is dropped whole rather than applied, so a divergent re-transcription can never overwrite the live canvas"

[vars.CODESCRIBE_TAIL_PATCH_SMALL_EDIT_FLOOR]
