description = "Tail-patch provider selector: inprocess | sidecar | remote. Sidecar and remote fall back to inprocess with typed receipts. Default remains inprocess; flipping it is an operator decision."

[vars.CODESCRIBE_STT_SIDECAR_BIN]
default = ""
