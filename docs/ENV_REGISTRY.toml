type = "string"
reload = "restart"
category = "stt"
description = "Override path to the ONNX Whisper model directory (onnx engine)"

[vars.CODESCRIBE_STT_ENGINE]
default = "auto"
type = "string"
reload = "restart"
category = "stt"
description = "STT engine: auto (Apple on supported macOS, Candle fallback), candle, onnx, or apple"

[vars.CODESCRIBE_ASR_MODE]
default = ""
type = "string"
reload = "restart"
category = "stt"
description = "Layer 1 ASR product mode: cloud, local_power, or apple_only (empty = derive from legacy use_local_stt, else apple_only). Promoted: settings.json is the source of truth; cloud additionally requires CODESCRIBE_CLOUD_CONSENT=granted"

[vars.CODESCRIBE_CLOUD_CONSENT]
default = ""
type = "string"
reload = "restart"
category = "stt"
description = "Explicit audio-egress consent record: granted or denied (empty = never asked; anything else reads as unanswered). Without granted, cloud mode resolves to apple_only and never loads local weights. Promoted: settings.json is the source of truth"

[vars.CODESCRIBE_ASR_GATEWAY_URL]
default = ""
type = "string"
reload = "restart"
category = "stt"
description = "Libraxis gateway session-mint endpoint (https; loopback http for dev). Endpoint only — URLs with user-info or query material are refused; vendor keys never live in config. Promoted: settings.json is the source of truth"

[vars.CODESCRIBE_LAYERED_TRANSCRIPTION]
default = ""
type = "string"
reload = "hot"
category = "stt"
description = "Promoted compatibility override for live local Whisper refinement. Product mode owns the default: Local Power with Apple/Auto arms the exact-span Apple progressive patcher when unset or phase1; explicit off/0/false/no and malformed values produce a named degraded disposition. Apple-only does not arm it. Direct Whisper on the VAD/scheduler path is already the primary engine and refuses a second unbound mutation lane. Phases 2..4 remain reserved. Orthogonal to FINAL_PASS_MODE; normal stop performs no whole-file pass. Runtime truth is the per-session tail_patch_session_receipt, not UI state."

[vars.CODESCRIBE_SEAL_ATLAS_DUMP]
default = ""
type = "string"
reload = "hot"
category = "stt"
description = "Operator evidence path. When set to a non-empty filesystem path, the Apple progressive worker writes one JSON file of sealed spans (id, text, PCM-pinned words, Apple/Whisper evidence) at session end. Empty = no-op. Diagnostic only — not a product setting."

[vars.CODESCRIBE_INLINE_FORMAT]
default = "0"
type = "bool"
reload = "hot"
category = "llm"
description = "W13-1 live inline-format buffer master switch. Default OFF; a default flip is an operator decision."

[vars.CODESCRIBE_INLINE_FORMAT_CHUNK_TIMEOUT_MS]
default = "10000"
type = "int"
reload = "hot"
category = "llm"
description = "Per-chunk inline-format LLM timeout in milliseconds; timeout keeps the raw chunk."

[vars.CODESCRIBE_INLINE_FORMAT_FLUSH_TIMEOUT_MS]
default = "2500"
type = "int"
reload = "hot"
category = "llm"
description = "Stop-path budget in milliseconds for draining queued inline-format chunks."

[vars.CODESCRIBE_INLINE_FORMAT_TAIL_TIMEOUT_MS]
