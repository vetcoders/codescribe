<div id="cs-bus-merged" aria-label="Codescribe — propozycja okna busa">
  <div class="cs-window">
    <header class="cs-chrome">
      <div class="cs-brand"><span class="cs-brand-dot"></span>codescribe</div>
      <div class="cs-wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span
        ><span></span><span></span><span></span><span></span><span></span
        ><span></span><span></span>
      </div>
      <span class="cs-chrome-time">00:08</span>
      <div class="cs-chrome-actions">
        <button
          type="button"
          class="cs-icon cursor-interaction"
          data-action="dictate"
          aria-label="Dyktowanie"
          data-tooltip="Dyktowanie"
        >
          <i data-lucide="pencil" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="cs-icon cursor-interaction"
          data-action="assistant"
          aria-label="Tryb Agent"
          data-tooltip="Tryb Agent"
        >
          <i data-lucide="sparkles" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="cs-icon cursor-interaction"
          data-action="pin"
          aria-label="Przypnij okno"
          aria-pressed="false"
          data-tooltip="Przypnij okno"
        >
          <i data-lucide="pin" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="cs-icon cursor-interaction"
          data-action="main-mic"
          aria-label="Mikrofon"
          data-tooltip="Mikrofon"
        >
          <i data-lucide="mic" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <div class="cs-workspace">
      <main class="cs-conversation">
        <header class="cs-conversation-heading">
          <div class="cs-heading-text">
            <div class="cs-heading-name">
              <h2 data-title>Rozmowa · Tola</h2>
              <span data-heading-status></span>
            </div>
            <div class="cs-heading-meta" data-view-meta>
              Kanał 2 <span>·</span>
              <span class="cs-online-dot"></span> połączona
            </div>
          </div>
          <div
            class="cs-current-actions"
            data-current-actions
            aria-label="Działania wybranego agenta"
          ></div>
        </header>
        <div class="cs-message-area">
          <div class="cs-message-heading">
            <span>Dzisiaj</span><span data-message-context>Ty i Tola</span>
          </div>
          <div class="cs-inbox-filters" data-inbox-filters hidden>
            <button
              type="button"
              class="cursor-interaction"
              data-filter="all"
              aria-pressed="true"
            >
              Wszystkie
            </button>
            <button
              type="button"
              class="cursor-interaction"
              data-filter="direct"
              aria-pressed="false"
            >
              Bezpośrednie
            </button>
            <button
              type="button"
              class="cursor-interaction"
              data-filter="shared"
              aria-pressed="false"
            >
              Wspólne
            </button>
          </div>
          <div class="cs-messages" data-messages aria-live="polite"></div>
        </div>
        <footer class="cs-composer-area">
          <div class="cs-routing-state">
            <span
              ><i data-lucide="mic-off" aria-hidden="true"></i
              ><span data-mic-label>Mikrofon wyłączony</span></span
            ><span data-view-label>Oglądasz: Tola</span>
          </div>

            <div class="cs-recipient-row">
              <label for="cs-recipient">Tekst do:</label
              ><select
                id="cs-recipient"
                aria-label="Adresat wiadomości"
              ></select
              ><button
                class="cs-match-recipient cursor-interaction"
                type="button"
                data-action="match-recipient"
                hidden
                data-match-recipient
              ></button>
            </div>
            <textarea
              rows="2"
              aria-label="Treść wiadomości"
              placeholder="Napisz wiadomość…"
              data-draft
            ></textarea>
            <div class="cs-composer-tools">
              <button
                type="button"
                class="cs-icon cursor-interaction"
                data-action="attachment"
                aria-label="Dodaj załącznik"
                data-tooltip="Dodaj załącznik"
              >
                <i data-lucide="plus" aria-hidden="true"></i></button
              ><span class="cs-draft-hint" data-draft-hint></span
              ><button
                type="button"
                class="cs-icon cursor-interaction"
                data-action="compose-mic"
                aria-label="Dyktuj tekst do pola"
                data-tooltip="Dyktuj tekst do pola"
              >
                <i data-lucide="mic" aria-hidden="true"></i></button
              ><button
                type="submit"
                class="cs-icon cs-send cursor-interaction"
                aria-label="Wyślij wiadomość"
                data-tooltip="Wyślij wiadomość"
              >
                <i data-lucide="arrow-up" aria-hidden="true"></i>
              </button>
            </div>
          </form>
        </footer>
      </main>
      <aside class="cs-sidebar" aria-label="Kanały i agenci">
        <header class="cs-sidebar-heading">
          <div class="cs-sidebar-heading-copy">
            <h2>Agenci</h2>
            <span data-agent-count>4 kanały</span>
          </div>

            class="cs-icon cursor-interaction"
            data-action="sidebar"
            aria-label="Zwiń panel agentów"
            aria-expanded="true"
            data-tooltip="Zwiń panel agentów"
          >
            <i data-lucide="panel-right-close" aria-hidden="true"></i>
          </button>
        </header>
        <nav class="cs-special" aria-label="Wspólna rozmowa i skrzynka">
          <button
            type="button"
            class="cs-special-row cursor-interaction"
            data-view="all"
            data-tooltip="0 · Wszyscy"
          >
            <span class="cs-channel-digit">0</span
            ><span class="cs-special-copy"
              ><span class="cs-special-name">Wszyscy</span
              ><span class="cs-special-preview"
                >Ty → Wszyscy · Krótki status prac?</span
              ></span
            ><span class="cs-special-tail" aria-label="Przeczytało 3 z 4"
              >3 z 4 <i data-lucide="check-check" aria-hidden="true"></i
            ></span>
          </button>
          <button
            type="button"
            class="cs-special-row cursor-interaction"
            data-view="inbox"
            data-tooltip="Twoja skrzynka — 2 nieobejrzane odpowiedzi"
          >
            <span class="cs-inbox-symbol"
              ><i data-lucide="inbox" aria-hidden="true"></i></span
            ><span class="cs-special-copy"
              ><span class="cs-special-name">Twoja skrzynka</span
              ><span class="cs-special-preview"
                >Wiadomości do Ciebie</span
              ></span
            ><span class="cs-count">2</span>
          </button>
        </nav>
        <div class="cs-roster" data-roster></div>
        <div class="cs-saved">
          <button
            type="button"
            class="cs-saved-toggle cursor-interaction"
            data-action="saved"
            aria-expanded="false"
            data-tooltip="Zapisane rozmowy"
          >
            <i data-lucide="archive" aria-hidden="true"></i
            ><span class="cs-saved-label">Zapisane rozmowy</span
            ><span class="cs-saved-count" data-saved-count>3</span
            ><i
              data-lucide="chevron-down"
              class="cs-saved-chevron"
              aria-hidden="true"
            ></i>
          </button>
          <div class="cs-saved-list" data-saved-list hidden></div>
        </div>
      </aside>
    </div>
    <div class="cs-notice" data-notice role="status" hidden>
      <span data-notice-text></span
      ><button
        type="button"
        class="cursor-interaction"
        data-action="dismiss-notice"
        aria-label="Zamknij komunikat"
      >
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="cs-menu" data-menu hidden></div>
  </div>
</div>

        item(
          "moon",
          a.dnd ? "Wyłącz Nie przeszkadzać" : "Włącz Nie przeszkadzać",
          "dnd",
          !a.online
        ) +
        item("square-terminal", "Otwórz miejsce pracy", "workspace") +
        item("x", "Odłącz i zachowaj rozmowę", "archive", !a.online);
      menu.hidden = false;
      icons();
      const box = $(".cs-window").getBoundingClientRect(),
        target = anchor.getBoundingClientRect();
      menu.style.left =
        Math.max(
          8,
          Math.min(
            target.right - box.left - menu.offsetWidth,
            box.width - menu.offsetWidth - 8
          )
        ) + "px";
      menu.style.top =
        Math.max(
          8,
          Math.min(target.bottom - box.top, box.height - menu.offsetHeight - 8)
        ) + "px";
      menu.querySelector("button:not(:disabled)")?.focus();
    }
    function messagesForView() {
      if (state.view === "all")
        return [
          {
            from: "Ty",
            to: "Wszyscy",
            text: "Krótki status prac? Najpierw ustalmy układ rozmowy i listy agentów.",
            time: "03:40",
            receipt: "Przeczytano 3 z 4",
            mine: true,
          },
          {
            from: "Tola",
            to: "Wszyscy",
            text: "Mam propozycję okna z rozwijanym panelem agentów. Funkcje zostają dostępne w obu układach.",
            time: "03:43",
            receipt: "Przeczytano 2 z 4",
          },
        ];
      if (state.view === "inbox")
        return [
          {
            from: "Lena",
            to: "Ty",
            text: "Przygotowałam dwie wersje sidebara. Którą szerokość porównujemy jako pierwszą?",
            time: "03:49",
            receipt: "Czeka na Twoją odpowiedź",
            awaiting: true,
            channel: "3",
            kind: "direct",
          },
          {
            from: "Tola",
            to: "Ty",
            text: "Zebrałam uwagi do układu. Wiadomości i działania agentów mają zostać czytelne także po zwinięciu panelu.",
            time: "03:51",
            receipt: "Doręczono",
            channel: "2",
            kind: "direct",
          },
          {
            from: "Basia",
            to: "Wszyscy",
            text: "Sprawdzę długie nazwy i wąskie okno, kiedy uzgodnimy kierunek.",
            time: "03:52",
            receipt: "Wspólna wiadomość",
            channel: "4",
            kind: "shared",
          },
        ].filter((m) => state.filter === "all" || m.kind === state.filter);
      const a = current();
      return [
        {
          from: "Ty",
          to: a.name,
          text: "Porównajmy oba układy. Chcę zachować informacje o agentach, ale dać więcej miejsca rozmowie.",
          time: "03:27",
          receipt: "Przeczytano",
          mine: true,
          channel: a.id,
        },
        {
          from: a.name,
          to: "Ty",
          text: "Rozmowa zostaje po lewej. Listę agentów możesz zwinąć do numerów, a działania otwartego agenta nadal masz w nagłówku.",
          time: "03:28",
          receipt: "Przeczytano",
          channel: a.id,
        },
        {
          from: a.name,
          to: "Ty",
          text: "Adresat tekstu jest widoczny przez cały czas pisania. Mikrofon ma osobny stan — wybór rozmowy go nie otwiera.",
          time: "03:51",
          receipt: "Doręczono",
          channel: a.id,
        },
      ];
    }
    function messages() {
      const all = [
        ...messagesForView(),
        ...additions.filter((m) => m.view === state.view),
      ];
      $("[data-messages]").innerHTML = all
        .map(
          (m, index) =>
            `<article class="cs-message ${m.mine ? "cs-from-me" : ""} ${
              m.awaiting ? "cs-awaiting" : ""
            }"><div class="cs-message-top"><span class="cs-message-route">${escapeHtml(
              m.from
            )} → ${escapeHtml(m.to)}</span><time class="cs-message-time">${
              m.time
            }</time></div><p class="cs-message-text">${escapeHtml(
              m.text
            )}</p><div class="cs-message-footer"><span class="cs-receipt">${
              m.receipt === "Przeczytano"
                ? '<i data-lucide="check-check" aria-hidden="true"></i>'
                : ""
            }${escapeHtml(m.receipt)}</span><span class="cs-message-actions">${
              m.mine
                ? ""
                : `<button type="button" class="cursor-interaction" data-reply="${
                    m.channel || "2"
                  }">Odpowiedz</button>`
            }<button type="button" class="cursor-interaction" data-copy="${index}">Kopiuj</button></span></div></article>`
        )
        .join("");
    }
    function render() {
      closeMenu();
      root.classList.toggle("cs-collapsed", Boolean(state.collapsed));
      root.style.setProperty("--cs-sidebar-width", design.sidebarWidth + "px");
      root.style.setProperty(
        "--cs-card-padding",
        design.spacing === "Zwarta" ? "11px" : "15px"
      );
      root.style.setProperty(
        "--cs-card-gap",
        design.spacing === "Zwarta" ? "8px" : "12px"
      );
      const a = current();
      $("[data-title]").textContent =
        state.view === "inbox"
          ? "Twoja skrzynka"
          : state.view === "all"
          ? "Wszyscy"
          : `Rozmowa · ${a.name}`;
      $("[data-view-meta]").innerHTML =
        state.view === "inbox"
          ? "Wiadomości adresowane do Ciebie"
          : state.view === "all"
          ? "Kanał 0 · wspólna rozmowa"
          : `Kanał ${a.id} <span>·</span> <span class="cs-online-dot ${
              a.online ? "" : "cs-offline-dot"
            }"></span> ${a.online ? "połączona" : "rozłączony"}`;
      $("[data-current-actions]").innerHTML = actionSet(a);
      $("[data-heading-status]").innerHTML = statusMarks(a);
      $("[data-current-actions]").hidden = !a;
      $("[data-message-context]").textContent =
        state.view === "inbox"
          ? "Bezpośrednie i wspólne"
          : state.view === "all"
          ? "Wspólna rozmowa"
          : `Ty i ${a.name}`;
      $("[data-view-label]").textContent =
        "Oglądasz: " +
        (a ? a.name : state.view === "all" ? "Wszyscy" : "Twoja skrzynka");
      const micAgent = agent(state.mic);
      $("[data-mic-label]").textContent = micAgent
        ? `Mówisz do: ${micAgent.id} · ${micAgent.name}`
        : "Mikrofon wyłączony";
      $("[data-mic-label]").parentElement.classList.toggle(
        "cs-speaking",
        Boolean(micAgent)
      );
      const toggle = $('[data-action="sidebar"]');
      toggle.setAttribute("aria-expanded", String(!state.collapsed));
      toggle.setAttribute(
        "aria-label",
        state.collapsed ? "Rozwiń panel agentów" : "Zwiń panel agentów"
      );
      toggle.setAttribute(
        "data-tooltip",
        state.collapsed ? "Rozwiń panel agentów" : "Zwiń panel agentów"
      );
      toggle.innerHTML = `<i data-lucide="${
        state.collapsed ? "panel-right-open" : "panel-right-close"
      }" aria-hidden="true"></i>`;
      $("#cs-recipient").innerHTML =
        '<option value="0">0 · Wszyscy</option>' +
        agents
          .map(
            (x) =>
              `<option value="${x.id}">${x.id} · ${escapeHtml(x.name)}</option>`
          )
          .join("");
      $("#cs-recipient").value = state.recipient;
      const match = $("[data-match-recipient]");
      match.hidden = !a || a.id === state.recipient;
      match.textContent = a ? `Pisz do ${a.name}` : "";
      $("[data-inbox-filters]").hidden = state.view !== "inbox";
      root
        .querySelectorAll("[data-filter]")
        .forEach((b) =>
          b.setAttribute(
            "aria-pressed",
            String(b.dataset.filter === state.filter)
          )
        );
      root
        .querySelectorAll(".cs-special-row")
        .forEach((b) =>
          b.setAttribute("aria-current", String(b.dataset.view === state.view))
        );
      roster();
      messages();
      icons();
    }
    let noticeTimer;
    function notice(text) {
      $("[data-notice-text]").textContent = text;
      $("[data-notice]").hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => {
        $("[data-notice]").hidden = true;
      }, 5500);
    }
    root.addEventListener("click", (event) => {
      if (
        !event.target.closest("[data-menu]") &&
        !event.target.closest('[data-action="menu"]')
      )
        closeMenu();
      const b = event.target.closest("button");
      if (!b || !root.contains(b) || b.disabled) return;
      if (b.dataset.view) {
        state.view = b.dataset.view;
        render();
        persist();
        return;
      }
      if (b.dataset.filter) {
        state.filter = b.dataset.filter;
        render();
        persist();
        return;
      }
      if (b.dataset.reply) {
        state.recipient = b.dataset.reply;
        render();
        $("[data-draft]").focus();
        persist();
        return;
      }
      if (b.dataset.copy !== undefined) {
        notice("Treść wiadomości jest gotowa do skopiowania.");
        return;
      }
      const a = agent(b.dataset.agent) || current();
      if (b.closest("[data-menu]")) closeMenu();
      switch (b.dataset.action) {
        case "menu":
          if (!$("[data-menu]").hidden && menuTrigger === b) {
            closeMenu();
          } else openMenu(a, b);
          break;
        case "sidebar":
          state.collapsed = !state.collapsed;
          render();
          persist();
          break;
        case "broadcast":
          if (a) {
            a.broadcast = !a.broadcast;
            render();
          }
          break;
        case "dnd":
          if (a) {
            a.dnd = !a.dnd;
            render();
          }
          break;
        case "audio":
          if (a) {
            a.audio = !a.audio;
            render();
          }
          break;
        case "talk":
          if (a) {
            state.mic = state.mic === a.id ? null : a.id;
            render();
          }
          break;
        case "match-recipient":
          if (a) {
            state.recipient = a.id;
            render();
            $("[data-draft]").focus();
            persist();
          }
          break;
        case "workspace":
          notice(`Miejsce pracy ${a?.name || "agenta"} — podgląd działania.`);
          break;
        case "archive":
          notice(
            "Odłączenie i zapisanie rozmowy — znaczenie tej akcji pozostaje do ustalenia."
          );
          break;
        case "saved": {
          if (state.collapsed) {
            state.collapsed = false;
            render();
          }
          const list = $("[data-saved-list]");
          list.hidden = !list.hidden;
          $('[data-action="saved"]').setAttribute(
            "aria-expanded",
            String(!list.hidden)
          );
          list.innerHTML = archived
            .map(
              (name) =>
                `<button type="button" class="cursor-interaction" data-action="saved-open">${escapeHtml(
                  name
                )}</button>`
            )
            .join("");
          break;
        }
        case "saved-open":
          notice("Wybrana zapisana rozmowa — podgląd miejsca w nawigacji.");
          break;
        case "pin":
          b.setAttribute(
            "aria-pressed",
            String(b.getAttribute("aria-pressed") !== "true")
          );
          break;
        case "dismiss-notice":
          $("[data-notice]").hidden = true;
          break;
        case "attachment":
          notice("Załączniki zostają w menu przy polu pisania.");
          break;
        case "compose-mic":
          notice("Dyktowanie do pola pisania — odrębne od mikrofonu kanału.");
          break;
        case "dictate":
        case "assistant":
        case "main-mic":
          notice("Górna belka jest kontekstem; jej układ ustalamy osobno.");
          break;
      }
    });
    root.addEventListener("contextmenu", (event) => {
      const card = event.target.closest("[data-card-agent]");
      if (card && !state.collapsed) {
        event.preventDefault();
        openMenu(agent(card.dataset.cardAgent), card);
      }
    });
    root.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !$("[data-menu]").hidden) {
        closeMenu(true);
        event.preventDefault();
      }
    });
    document.addEventListener("click", (event) => {
      if (!root.contains(event.target)) closeMenu();
    });
    $("#cs-recipient").addEventListener("change", (e) => {
      state.recipient = e.target.value;
      render();
      persist();
    });
    $("[data-composer]").addEventListener("submit", (e) => {
      e.preventDefault();
      const field = $("[data-draft]");
      const text = field.value.trim();
      if (!text) {
        field.focus();
        return;
      }
      const recipient = agent(state.recipient);
      additions.push({
        view: state.view,
        from: "Ty",
        to: recipient ? recipient.name : "Wszyscy",
        text,
        time: "teraz",
        receipt: "Podgląd wiadomości · nie wysłano",
        mine: true,
      });
      field.value = "";
      render();
    });
    window.addEventListener("openai:set_globals", (event) => {
      const s = event.detail?.globals?.widgetState?.privateContent;
      if (s && typeof s === "object") {
        for (const k of ["view", "recipient", "collapsed", "filter"])
          if (k in s) state[k] = s[k];
        if (!["2", "3", "4", "8", "all", "inbox"].includes(state.view))
          state.view = "2";
        render();
      }
    });
    render();
    if (globalThis.Tweak) {
      const tweak = new globalThis.Tweak({ container: root, onChange: render });
      tweak.addSlider(design, "sidebarWidth", {
        label: "Szerokość listy agentów",
        min: 270,
        max: 360,
        step: 4,
        unit: "px",
      });
      tweak.addSelect(design, "spacing", {
        label: "Odstępy w kartach",
        options: ["Zwarta", "Swobodna"],
      });
      tweak.addToggle(state, "collapsed", { label: "Zwinięty sidebar" });
    }
  })();
</script>
