# Pre-commit hooks for Codescribe (Pure Rust)
# Install: pipx install pre-commit && make hooks
# Run: pre-commit run --all-files
#
# Created by Vetcoders (c)2026

minimum_pre_commit_version: "3.5.0"

repos:
  # Essential hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/truth_sidecar_20260421\.json$
      - id: end-of-file-fixer
        # Byte-verbatim April sidecar (sha256-checked); see .prettierignore.
        exclude: ^tests/fixtures/truth_sidecar_20260421\.json$
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  # Rust hooks (pre-commit stage)
  - repo: local
    hooks:
      - id: cargo-check
        name: cargo check
        entry: scripts/git-hooks/embargo-guard.sh cargo-check -- cargo check --all-targets
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fmt
        name: cargo fmt (fix)
        entry: scripts/git-hooks/embargo-guard.sh cargo-fmt -- bash -c 'cargo fmt --all && git add -u'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

  # Localization gates (pre-commit stage)
  #
  # Both read files and exit; neither builds anything, so they cost about a
  # tenth of a second each and run on every commit rather than on a `files:`
  # pattern. The channel matters: a Swift string, a Rust field, a catalog edit
  # and a classification line live in four different places, and a gate that
  # fires only for some of them is a gate with a door in it.
  #
  # `verify-l10n-sync` is deliberately absent: it compares the catalog with a
  # real Debug build and belongs to CI (.github/workflows/l10n.yml), not to a
  # commit.
  - repo: local
    hooks:
      - id: verify-l10n-catalog
        name: localization catalogs
        entry: scripts/git-hooks/embargo-guard.sh verify-l10n-catalog -- make verify-l10n-catalog
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: verify-l10n-bridge
        name: localization bridge census
        entry: scripts/git-hooks/embargo-guard.sh verify-l10n-bridge -- env L10N_BASE=origin/main make verify-l10n-bridge
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  # Prettier for non-Rust files (pre-commit stage)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        name: prettier (non-rust)
        entry: scripts/git-hooks/embargo-guard.sh prettier -- prettier --write --ignore-unknown
        files: '\.(md|mdx|json|ya?ml|html?|css|scss|js|jsx|ts|tsx|mjs|cjs)$'
        stages: [pre-commit]

  # Rust + Security hooks (pre-push stage)
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: scripts/git-hooks/embargo-guard.sh cargo-clippy -- cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep
        name: semgrep security scan
        entry: scripts/git-hooks/embargo-guard.sh semgrep -- semgrep scan --config auto --config .semgrep.yaml --error --exclude-rule rust.actix.path-traversal.tainted-path.tainted-path --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket .
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Commit provenance (commit-msg stage)
  - repo: local
    hooks:
      - id: commit-msg-provenance
        name: commit message provenance
        entry: scripts/commit-msg-provenance.sh
        language: system
        stages: [commit-msg]
