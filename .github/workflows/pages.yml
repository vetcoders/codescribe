name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The release refresh dispatches the build below; a shared group would let
  # that dispatched run cancel the refresh that started it.
  group: ${{ github.event_name == 'release' && 'pages-release-refresh' || 'pages' }}
  cancel-in-progress: true

jobs:
  refresh-after-release:
    # Pages permits deployments from main only, not release tag refs.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      # `published` fires while the release job is still uploading assets, and
      # the site build refuses a release without an uploaded Codescribe.dmg.
      # v0.16.0 was published at 13:23:07Z, the refresh built at 13:23:34Z and
      # failed, and Codescribe.dmg was created at 13:29:51Z.
      - name: Wait for the uploaded DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '[.assets[] | select(.name == "Codescribe.dmg") | .state] | join(",")')
            if [ "$state" = "uploaded" ]; then
              echo "Codescribe.dmg is uploaded for $TAG"
              exit 0
            fi
            echo "Attempt $attempt: Codescribe.dmg state is '${state:-absent}'"
            sleep 20
          done
          echo "::error::Codescribe.dmg was not uploaded to $TAG within 20 minutes"
          exit 1

      - name: Rebuild website from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Verify release metadata contract
        run: npm run test:release
        working-directory: site
      # The build resolves GitHub Releases and verifies the DMG itself.
      - name: Build
        run: npm run build
        working-directory: site
        env:
          PAGES_DEPLOYMENT: "true"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    name: Deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
