name: Release DMG

# Two lanes, one file.
#
#   release — a `v*` tag push, or `workflow_dispatch` with `tag_name`: signs,
#             notarizes and staples the slim DMG (the Whisper-embedded full DMG
#             only when `variant: full` is requested), runs the payload gate and
#             attaches the artifacts, checksums and signed appcast to a DRAFT
#             GitHub release. Publishing the draft after the cold-path check in
#             docs/PUBLIC_RELEASE_CHECKLIST.md is a human click.
#   smoke   — `workflow_dispatch` with `smoke: true`: builds the slim DMG from the
#             dispatched ref with `make dmg` (no Developer ID), runs the payload
#             gate without signature and notary checks and keeps the DMG as a run
#             artifact. It needs no secret and never touches a release; it exists
#             to prove that the hosted image still builds this product.
#
# Both lanes run on the GitHub-hosted `xcode-27` preview image
# (actions/runner-images#14404): the Swift app does not compile on Xcode 26, so
# `macos-latest` would fail every tag run right after the secrets were validated.
# This is a public repository; nothing here runs on a self-hosted runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish (for example v0.18.0). Ignored by a smoke build.
        required: false
        default: ""
      variant:
        description: slim is the public artifact; full also embeds Whisper
        type: choice
        options:
          - slim
          - full
        default: slim
      smoke:
        description: Smoke build of the dispatched ref (no signing, no notarization, no release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Local release DMGs are cut with Xcode 27.2. The image defaults to 27.1 and
  # ships 27.2 beside it; build with the toolchain the product is proven on.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app

jobs:
  smoke:
    name: Smoke build (unsigned, run artifact only)
    if: github.event_name == 'workflow_dispatch' && inputs.smoke
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      # Public values (repository variables), the same ones the release lane
      # bakes in, so the payload gate can check the bundle against them.
      CODESCRIBE_LICENSE_PUBLIC_KEY_HEX: ${{ vars.CODESCRIBE_LICENSE_PUBLIC_KEY_HEX }}
      SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show the Xcode this job selected
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install XcodeGen
        # scripts/build-app.sh preflights `require xcodegen`: the .xcodeproj is
        # generated, not committed.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build the slim DMG without a Developer ID
        run: make dmg

      - name: Run the payload gate without signature and notary checks
        run: |
          set -euo pipefail
          VERSION="$(make -s version)"
          VERSION="${VERSION#v}"
          shopt -s nullglob
          dmgs=(Codescribe_*.dmg)
          (( ${#dmgs[@]} == 1 )) || {
            echo "Expected exactly one Codescribe_*.dmg, found ${#dmgs[@]}"
            exit 1
          }
          scripts/verify-dmg-payload.sh "${dmgs[0]}" --variant slim --version "$VERSION" --skip-notary --unsigned

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codescribe-smoke-dmg
          path: |
            Codescribe_*.dmg
            Codescribe_*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build, notarize, and publish DMG
    if: github.event_name == 'push' || !inputs.smoke
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: write
    # Deployment gate: `workflow_dispatch` can otherwise be fired by anyone with
    # write access against any tag. Protection rules (required reviewers,
    # deployment branches/tags) live on the `release` environment in repo
    # settings — configure them there; this line is what makes them apply.
    environment:
      name: release
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
      VARIANT: ${{ inputs.variant || 'slim' }}
    steps:
      - name: Refuse anything but a vX.Y.Z tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must have the form vX.Y.Z (got: $RELEASE_TAG)"
            exit 1
          }

      - name: Refuse to publish over existing release assets
        # Changed release bytes need a new patch version; a rerun must never
        # replace what a published appcast already signed.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [[ -n "$assets" ]]; then
            echo "Release $RELEASE_TAG already carries assets:"
            printf '%s\n' "$assets" | sed 's/^/  /'
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Show the Xcode this job selected
        run: xcodebuild -version

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Validate release keys and signing secrets
        env:
          CODESIGN_CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          CODESCRIBE_CODESIGN_IDENTITY: ${{ secrets.CODESCRIBE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CODESCRIBE_LICENSE_PUBLIC_KEY_HEX: ${{ vars.CODESCRIBE_LICENSE_PUBLIC_KEY_HEX }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$CODESIGN_CERTIFICATE_BASE64" || { echo "Missing CODESIGN_CERTIFICATE_BASE64"; exit 1; }
          test -n "$CODESIGN_CERTIFICATE_PASSWORD" || { echo "Missing CODESIGN_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$CODESCRIBE_CODESIGN_IDENTITY" || { echo "Missing CODESCRIBE_CODESIGN_IDENTITY"; exit 1; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD"; exit 1; }
          [[ "$CODESCRIBE_LICENSE_PUBLIC_KEY_HEX" =~ ^[[:xdigit:]]{64}$ ]] || { echo "Missing or invalid CODESCRIBE_LICENSE_PUBLIC_KEY_HEX repository variable"; exit 1; }
          test -n "$SPARKLE_ED_PUBLIC_KEY" || { echo "Missing SPARKLE_ED_PUBLIC_KEY repository variable"; exit 1; }
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "Missing SPARKLE_ED_PRIVATE_KEY secret"; exit 1; }

      - name: Import Developer ID certificate
        env:
          CODESIGN_CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          KEYCHAIN_SESSION_STATE_DIR: ${{ runner.temp }}/keychain-session
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/codesign.p12"
          echo "$CODESIGN_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"

          # The search-list / default-keychain dance is NOT inlined here any
          # more. This step used to prepend an ephemeral keychain to the user
          # search list and never put the list back — it relied on
          # `delete-keychain` unlisting it, which only works while the file
          # still exists. On a self-hosted runner that leaves the operator's
          # own keychain domain pointing at a deleted path (2026-08-15 P0).
          # scripts/lib/keychain-session.sh snapshots as structured argv,
          # unlists before deleting, and is concurrency-safe.
          KEYCHAIN_PATH="$(scripts/lib/keychain-session.sh begin codescribe-signing)"
          echo "CODESCRIBE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Read into a variable, never echo. The ephemeral password exists so
          # the keychain is not world-openable on a shared runner.
          KEYCHAIN_PASSWORD="$(cat "$(scripts/lib/keychain-session.sh password-file codescribe-signing)")"
          security import "$CERT_PATH" -P "$CODESIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          # The identity now lives in the keychain; the raw PKCS12 has no
          # further use. Overwrite-then-unlink so the private key material
          # never survives on the runner disk (`rm -P` = 3-pass overwrite).
          rm -P "$CERT_PATH"

      - name: Configure Apple notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "CodescribeNotary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, notarize and gate the DMG
        # Both targets end with the fail-closed payload gate. The slim build
        # embeds Silero only and reads no model cache; release-full warms the
        # Whisper cache itself (ensure-models) before it embeds the model.
        env:
          CODESCRIBE_CODESIGN_IDENTITY: ${{ secrets.CODESCRIBE_CODESIGN_IDENTITY }}
          CODESCRIBE_BUNDLE_ID: ${{ vars.CODESCRIBE_BUNDLE_ID || 'com.vetcoders.codescribe' }}
          CODESCRIBE_LICENSE_PUBLIC_KEY_HEX: ${{ vars.CODESCRIBE_LICENSE_PUBLIC_KEY_HEX }}
          NOTARY_PROFILE: CodescribeNotary
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            slim) make release-standard ;;
            full) make release-full ;;
            *) echo "Unknown variant: $VARIANT"; exit 1 ;;
          esac

      - name: Verify DMG payloads against the tag
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          shopt -s nullglob
          dmgs=(Codescribe_*.dmg)
          (( ${#dmgs[@]} == 1 )) || {
            echo "Expected exactly one Codescribe_*.dmg, found ${#dmgs[@]}"
            exit 1
          }
          variant=slim
          [[ "${dmgs[0]}" == *_full.dmg ]] && variant=full
          [[ "$variant" == "$VARIANT" ]] || {
            echo "Built a $variant DMG while $VARIANT was requested"
            exit 1
          }
          echo "Verifying ${dmgs[0]} as $variant for version $VERSION"
          scripts/verify-dmg-payload.sh "${dmgs[0]}" --variant "$variant" --version "$VERSION"

      - name: Alias slim DMG as stable Codescribe.dmg
        if: env.VARIANT == 'slim'
        # The website pins two asset URLs that must survive the provenance slug
        # (Codescribe_<ver>-<date>-<sha>.dmg): releases/latest/download/Codescribe.dmg
        # and releases/download/v<ver>/Codescribe.dmg. Publish the slug artifact
        # for provenance AND a stable-named copy for the funnel, each with its
        # SHA-256 (bare filename inside, so `shasum -c` works from the download dir).
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMG=""
          for candidate in Codescribe_*.dmg; do
            [[ "$candidate" == *_full.dmg ]] && continue
            DMG="$candidate"
            break
          done
          test -n "$DMG" || { echo "No slim Codescribe_*.dmg produced"; exit 1; }
          cp "$DMG" Codescribe.dmg
          shasum -a 256 Codescribe.dmg > Codescribe.dmg.sha256

      - name: Generate signed Sparkle appcast
        if: env.VARIANT == 'slim'
        # The appcast is attached to the release as provenance; publishing it to
        # the live feed (site/public/appcast.xml) stays a human step.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          scripts/generate-appcast.sh . \
            -o appcast.xml \
            --download-url-prefix "https://github.com/vetcoders/codescribe/releases/download/${RELEASE_TAG}/"

      - name: Publish draft release with the slim DMG, checksums and appcast
        if: env.VARIANT == 'slim'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            Codescribe_*.dmg
            Codescribe_*.dmg.sha256
            Codescribe.dmg
            Codescribe.dmg.sha256
            appcast.xml

      - name: Publish draft release with the full DMG and checksum
        if: env.VARIANT == 'full'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            Codescribe_*_full.dmg
            Codescribe_*_full.dmg.sha256

      - name: Release the signing keychain
        # Runs on every outcome: a failed build must not leave the imported
        # Developer ID identity resident on the runner, AND must not leave the
        # ephemeral keychain in the user search list or as the default
        # keychain. `end` unlists first and deletes second, so it still cleans
        # up when the keychain file has already been destroyed — the exact
        # sequence that poisoned the operator's host on 2026-08-15.
        if: always()
        env:
          KEYCHAIN_SESSION_STATE_DIR: ${{ runner.temp }}/keychain-session
        run: |
          if [ ! -x scripts/lib/keychain-session.sh ]; then
            echo "::warning::checkout missing; cannot release the signing keychain"
            exit 0
          fi
          scripts/lib/keychain-session.sh end codescribe-signing
          # Read-only verdict on what the runner's keychain domain looks like
          # now. Advisory: a dirty domain must be visible, not silent, but it
          # must not fail an otherwise successful release.
          scripts/keychain-doctor.sh || \
            echo "::warning::runner keychain domain still has stale entries after cleanup"
