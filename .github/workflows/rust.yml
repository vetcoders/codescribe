# Rust Code Quality CI
# Created by Vetcoders (c)2026
#
# Runs on self-hosted macOS runners (Swift 6.0 / CoreML / Metal available).
# format: cargo fmt --check
# quality: cargo clippy -D warnings + `make verify`.
#
# The test step invokes `make verify` by name rather than repeating its cargo
# line here. That is deliberate: it is the repo's one hermetic gate, so CI and a
# local run are the same command with one definition site instead of two recipes
# that resemble each other until they quietly stop.
#
# What CI does NOT run: every `class=operator` row in the Makefile GATE LEDGER —
# the parity bars (private fixture corpus), the 318 Swift front-end tests
# (Xcode + a built ffi dylib), `smoke-macos27` (this host), and the #[ignore]
# real-API / model / audio-device tests. Those are bench instruments, host-local
# by nature, and `make -s gate-ledger` prints the full classification.
# (This block used to claim `make check` was the "full local gate incl. real-API
# / heavy e2e tests". It is not — `make check` executes no tests at all.)

name: Rust Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.88 MSRV
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Ensure MSRV toolchain on PATH
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          dirname "$(rustup which --toolchain 1.88.0 rustc)" >> "$GITHUB_PATH"

      - name: cargo check at MSRV
        run: cargo check --workspace --all-targets

  format:
    name: Format Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Self-hosted runners carry a Homebrew rustup (RUSTUP_HOME=~/.rustup) and a
      # runner-local CARGO_HOME (see runner .env) that holds NO rustc/cargo proxies,
      # so any action that exposes "$CARGO_HOME/bin" on PATH resolves nothing.
      # Put the actual toolchain bin dir on PATH instead.
      - name: Ensure stable toolchain on PATH
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          dirname "$(rustup which --toolchain stable rustc)" >> "$GITHUB_PATH"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  quality:
    name: Clippy + Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Same PATH contract as the format job — Homebrew rustup, proxy-less CARGO_HOME.
      - name: Ensure stable toolchain on PATH
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          dirname "$(rustup which --toolchain stable rustc)" >> "$GITHUB_PATH"

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The hermetic gate, by name. `make verify` pins the env this step used to
      # set inline (CODESCRIBE_DISABLE_KEYCHAIN=1 so keychain-backed tests never
      # touch the real macOS Keychain — no interactive unlock on a runner, see
      #   core/config/keychain.rs — plus CODESCRIBE_NO_EMBED=1 so the build does
      #   not depend on a model cache), runs the workspace tests AND the
      #   doctests, then validates the env registry and the gate ledger.
      #
      # Invoked by name rather than repeated as a cargo line: one definition
      # site means a local run and this job cannot drift apart.
      #
      # #[ignore]-gated tests (real LLM APIs, Whisper/STT models, audio devices,
      #   live SSE) are still NOT run here — they need secrets/hardware absent
      #   on CI and stay behind the class=operator rows of the GATE LEDGER.
      - name: make verify
        run: make verify
