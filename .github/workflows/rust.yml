# Rust Code Quality CI
# Created by Vetcoders (c)2026
#
# Runs on self-hosted macOS runners (Swift 6.0 / CoreML / Metal available).
# format: cargo fmt --check
# quality: cargo clippy -D warnings + cargo test (workspace).
# Full local gate (incl. real-API / heavy e2e tests) still via: make check

name: Rust Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Self-hosted runners carry a Homebrew rustup (RUSTUP_HOME=~/.rustup) and a
      # runner-local CARGO_HOME (see runner .env) that holds NO rustc/cargo proxies,
      # so any action that exposes "$CARGO_HOME/bin" on PATH resolves nothing.
      # Put the actual toolchain bin dir on PATH instead.
      - name: Ensure stable toolchain on PATH
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          dirname "$(rustup which --toolchain stable rustc)" >> "$GITHUB_PATH"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  quality:
    name: Clippy + Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Same PATH contract as the format job — Homebrew rustup, proxy-less CARGO_HOME.
      - name: Ensure stable toolchain on PATH
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          dirname "$(rustup which --toolchain stable rustc)" >> "$GITHUB_PATH"

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the default (non-#[ignore]) workspace test set.
      # CODESCRIBE_DISABLE_KEYCHAIN=1: keychain-backed tests must bypass the
      #   macOS Keychain (no interactive unlock / signed host on the runner) —
      #   see core/config/keychain.rs and the Makefile `test` target.
      # #[ignore]-gated tests (real LLM APIs, Whisper/STT models, audio devices,
      #   live SSE) are intentionally NOT run here — they need secrets/hardware
      #   absent on CI and stay behind `make test` / `make test-e2e-real` locally.
      - name: cargo test --workspace
        env:
          CODESCRIBE_DISABLE_KEYCHAIN: "1"
        run: cargo test --workspace
