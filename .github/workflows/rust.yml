# Rust Code Quality CI
# Created by Vetcoders (c)2026
#
# Runs on GitHub-hosted macOS runners. Rust-only jobs use `macos-latest`
# (macOS 26 arm64); the job that compiles Swift for localization extraction uses
# the `xcode-27` image, because the app requires Xcode 27 / the macOS 27 SDK
# (docs/LOCALIZATION.md) and `macos-latest` ships Xcode 26.6. This is a public
# repository: it never runs on a self-hosted runner (decision 2026-10-13).
# format: cargo fmt --check
# quality: fresh compiler localization extraction + strict catalog/bridge gates,
# sync controls, helper installer compilation, cargo clippy -D warnings + `make verify`.
# Localization runs inside the existing required `Clippy + Tests` status.
# Keep its job name and unconditional steps: no partial coverage or ignored failures.
#
# The test step invokes `make verify` by name rather than repeating its cargo
# line here. That is deliberate: it is the repo's one hermetic gate, so CI and a
# local run are the same command with one definition site instead of two recipes
# that resemble each other until they quietly stop.
#
# What CI does NOT run: the `class=operator ci=no` rows in the Makefile GATE LEDGER —
# the parity bars (private fixture corpus), the 318 Swift front-end tests
# (Xcode + a built ffi dylib), `smoke-macos27` (needs a macOS 27 host), and the #[ignore]
# real-API / model / audio-device tests. Those are bench instruments, host-local
# by nature, and `make -s gate-ledger` prints the full classification.
# (This block used to claim `make check` was the "full local gate incl. real-API
# / heavy e2e tests". It is not — `make check` executes no tests at all.)

name: Rust Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.94 MSRV
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The real minimum from Cargo.toml `rust-version = "1.94"`, as a point release.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: cargo check at MSRV
        run: cargo check --workspace --all-targets

  format:
    name: Format Check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  quality:
    name: Clippy + Tests
    # Preview image with Xcode 27 on macOS 27 (actions/runner-images#14404);
    # the Swift localization build below does not compile on Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      # `make verify` would run the live Loctree throne rows wherever `loct` is on
      # PATH. A hosted runner has none; say so explicitly instead of relying on it.
      CODESCRIBE_SKIP_LIVE_THRONE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show the Xcode this image selected
        run: xcodebuild -version

      - name: Verify catalog localization contracts
        run: make verify-l10n-catalog

      - name: Verify every bridge String is classified
        run: make verify-l10n-bridge

      - name: Prepare compiler localization extraction
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          # Fresh per run; never read cached extraction.
          echo "L10N_DERIVED=$(mktemp -d "$RUNNER_TEMP/codescribe-l10n.XXXXXX")" >> "$GITHUB_ENV"
          echo "L10N_CONFIG=Debug" >> "$GITHUB_ENV"

      - name: Build Debug Swift localization data (no Rust build or executable link)
        run: |
          make l10n-build
          # A future Xcode sync-on-build must not let CI check a repaired catalog.
          git diff --exit-code -- macos/Codescribe/Resources/Localization

      - name: Verify Swift strings match the committed catalog
        run: make verify-l10n-sync

      - name: Test localization gate positive and negative controls
        run: make test-l10n-sync

      - name: Verify the helper installer compiles without the app target
        run: make verify-install-bus

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      # A hosted runner starts cold on every run; the cache carries the registry
      # and the target directory between runs of this job.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The hermetic gate, by name. `make verify` pins the env this step used to
      # set inline (CODESCRIBE_DISABLE_KEYCHAIN=1 so keychain-backed tests never
      # touch the real macOS Keychain — no interactive unlock on a runner, see
      #   core/config/keychain.rs — plus CODESCRIBE_NO_EMBED=1 so the build does
      #   not depend on a model cache), runs the workspace tests AND the
      #   doctests, then validates the env registry and the gate ledger.
      #
      # Invoked by name rather than repeated as a cargo line: one definition
      # site means a local run and this job cannot drift apart.
      #
      # #[ignore]-gated tests (real LLM APIs, Whisper/STT models, audio devices,
      #   live SSE) are still NOT run here — they need secrets/hardware absent
      #   on CI and stay behind the class=operator rows of the GATE LEDGER.
      - name: make verify
        run: make verify
