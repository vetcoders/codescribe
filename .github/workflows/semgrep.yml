name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Queue entries are never cancelled: a merge_group run has a unique ref, and
# only superseded pull_request runs are cancelled.
concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Security Scan
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail

          if command -v semgrep >/dev/null 2>&1; then
            semgrep --version
            exit 0
          fi

          if command -v brew >/dev/null 2>&1; then
            brew install semgrep
            semgrep --version
            exit 0
          fi

          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install semgrep
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version

      - name: Run Semgrep
        run: semgrep scan --config auto --config .semgrep.yaml --error --exclude-rule rust.actix.path-traversal.tainted-path.tainted-path --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket .
